services:
  db:
    image: postgres:16
    container_name: gestor_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Sin "ports": la base de datos solo es accesible desde los otros contenedores
    networks:
      - gestor_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gestor_api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      UPLOAD_DIR: /uploads
      MAX_SUBIDA_MB: ${MAX_SUBIDA_MB:-100}            # opcional en .env
      SUBIDAS_POR_MINUTO: ${SUBIDAS_POR_MINUTO:-25}   # opcional en .env, por usuario
      LOGIN_INTENTOS_POR_MINUTO: ${LOGIN_INTENTOS_POR_MINUTO:-10}  # opcional en .env, por email
    volumes:
      - ./uploads:/uploads
      - ./frontend:/frontend:ro
    # La app (página + API) queda en http://<servidor> (puerto 80 -> 8000 del contenedor)
    ports:
      - "80:8000"
    depends_on:
      - db
    networks:
      - gestor_net

volumes:
  postgres_data:

networks:
  gestor_net:
    driver: bridge

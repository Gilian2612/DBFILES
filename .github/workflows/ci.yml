name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-test.txt

      - name: Install dependencies
        working-directory: api
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        working-directory: api
        env:
          FRONTEND_DIR: /tmp/frontend_ci
          UPLOAD_DIR:   /tmp/uploads_ci
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY:   ci_test_secret_key_32bytes_xxxxx
        run: |
          mkdir -p /tmp/frontend_ci
          echo '<html><body>ci</body></html>' > /tmp/frontend_ci/index.html
          python -m pytest tests/ -v \
            --cov=. \
            --cov-omit="tests/*" \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/coverage.xml
          retention-days: 30

  build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build api/ -t gestor-documental:ci --no-cache

services:
  db:
    image: postgres:16
    container_name: gestor_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - gestor_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gestor_api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      UPLOAD_DIR: /uploads
    volumes:
      - ./uploads:/uploads
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - gestor_net

  frontend:
    image: nginx:alpine
    container_name: gestor_frontend
    restart: always
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    networks:
      - gestor_net

volumes:
  postgres_data:

networks:
  gestor_net:
    driver: bridge
